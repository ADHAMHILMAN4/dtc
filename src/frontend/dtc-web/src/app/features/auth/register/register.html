<div class="register-page">
    <main class="register-container">
        <mat-card class="register-card">
            <!-- Header -->
            <div class="register-header">
                <h1>DreamTechCareer</h1>

                <p>Create an account to continue</p>
            </div>

            <!-- Form -->
            <form class="register-form" (ngSubmit)="onSubmit()">
                <!-- Username -->
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Username</mat-label>

                    <mat-icon matPrefix>person</mat-icon>

                    <input
                        matInput
                        type="text"
                        name="username"
                        [(ngModel)]="username"
                        placeholder="johndoe"
                        required
                    />
                </mat-form-field>

                <!-- Email -->
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>

                    <mat-icon matPrefix>mail</mat-icon>

                    <input
                        matInput
                        type="email"
                        name="email"
                        [(ngModel)]="email"
                        placeholder="john@example.com"
                        required
                    />
                </mat-form-field>

                <!-- Password -->
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Password</mat-label>

                    <mat-icon matPrefix>lock</mat-icon>

                    <input
                        matInput
                        [type]="hidePassword ? 'password' : 'text'"
                        name="password"
                        [(ngModel)]="password"
                        required
                    />

                    <button
                        mat-icon-button
                        matSuffix
                        type="button"
                        (click)="hidePassword = !hidePassword"
                        [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
                    >
                        <mat-icon>
                            {{ hidePassword ? 'visibility' : 'visibility_off' }}
                        </mat-icon>
                    </button>
                </mat-form-field>

                <!-- Confirm Password -->
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Confirm Password</mat-label>

                    <mat-icon matPrefix>lock_reset</mat-icon>

                    <input
                        matInput
                        [type]="hideConfirmPassword ? 'password' : 'text'"
                        name="confirmPassword"
                        [(ngModel)]="confirmPassword"
                        required
                    />

                    <button
                        mat-icon-button
                        matSuffix
                        type="button"
                        (click)="hideConfirmPassword = !hideConfirmPassword"
                        [attr.aria-label]="hideConfirmPassword ? 'Show password' : 'Hide password'"
                    >
                        <mat-icon>
                            {{ hideConfirmPassword ? 'visibility' : 'visibility_off' }}
                        </mat-icon>
                    </button>
                </mat-form-field>

                <!-- Terms -->
                <div class="terms">
                    <mat-checkbox name="terms" [(ngModel)]="termsAccepted" required>
                        <span>
                            I agree to the
                            <a href="register">Terms of Service</a>
                            and
                            <a href="register">Privacy Policy</a>
                        </span>
                    </mat-checkbox>
                </div>

                <!-- Submit -->
                <button matButton="filled" type="submit" class="submit-button">
                    Create Account
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Google -->
            <button mat-stroked-button type="button" class="google-button">
                <!-- Google icon -->
                <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4"
                    />

                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853"
                    />

                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05"
                    />

                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335"
                    />
                </svg>

                Continue with Google
            </button>

            <!-- Login -->
            <div class="login-link">
                <p>
                    Already have an account?
                    <a routerLink="/login"> Sign In </a>
                </p>
            </div>
        </mat-card>
    </main>
</div>
